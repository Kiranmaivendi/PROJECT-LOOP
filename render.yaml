services:
  - type: web
    name: project-loop-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        value: YOUR_MONGODB_URI_HERE
      - key: JWT_SECRET
        value: project-loop-super-secret-key
      - key: OPENAI_API_KEY
        value: your_openai_api_key_here
      - key: NODE_ENV
        value: production
